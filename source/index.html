 직접 문헌 검증을 완료했다는 뜻이 아님"]]};const terms=DB.terms,byId=Object.fromEntries(terms.map(t=>[t.id,t]));let selected=terms.find(x=>x.name==='무인')?.id||terms[0].id;const opened=new Set(terms.map(x=>x.category));function el(s){return document.createTextNode(s)}function renderTree(){let q=document.getElementById('search').value.trim().toLowerCase();let matches=terms.filter(t=>[t.name,t.hanja,t.definition,t.category,t.subcategory].some(v=>v.toLowerCase().includes(q)));document.getElementById('counter').textContent=`전체 ${terms.length}개 · 검색 결과 ${matches.length}개`;let root=document.getElementById('tree');root.replaceChildren();for(let c of [...new Set(matches.map(t=>t.category))]){let b=document.createElement('button');b.className='cat';b.textContent=(opened.has(c)?'▾ ':'▸ ')+c;b.onclick=()=>{opened.has(c)?opened.delete(c):opened.add(c);renderTree()};root.append(b);if(!opened.has(c)&&!q)continue;for(let sub of [...new Set(matches.filter(t=>t.category===c).map(t=>t.subcategory))]){let g=document.createElement('div');g.className='sub';g.textContent=sub;root.append(g);for(let t of matches.filter(t=>t.category===c&&t.subcategory===sub)){let n=document.createElement('button');n.className='term'+(t.id===selected?' active':'');n.textContent=t.name+(t.hanja?' ('+t.hanja+')':'');n.onclick=()=>select(t.id);root.append(n)}}}}function select(id){selected=id;let t=byId[id];if(!t)return;let related=DB.relations.filter(r=>r[0]===id||r[1]===id).map(r=>({id:r[0]===id?r[1]:r[0],type:r[2]}));let d=document.getElementById('detail');d.replaceChildren();let c=document.createElement('div');c.className='card';let meta=document.createElement('p');meta.className='meta';meta.textContent=t.category+' › '+t.subcategory+' · '+t.id;let title=document.createElement('h2');title.textContent=t.name+(t.hanja?' ('+t.hanja+')':'');let desc=document.createElement('p');desc.textContent=t.definition;let source=document.createElement('p');source.className='notice';source.textContent='출처 구분: '+t.source+' (개별 원전 대조 미완료)';c.append(meta,title,desc,source);let h=document.createElement('h3');h.textContent='관련 용어';c.append(h);if(!related.length){let p=document.createElement('p');p.className='notice';p.textContent='등록된 직접 관계가 없습니다.';c.append(p)}for(let r of related){let target=byId[r.id];if(!target)continue;let span=document.createElement('span');span.className='pill';let btn=document.createElement('button');btn.textContent=target.name+' · '+r.type;btn.onclick=()=>select(target.id);span.append(btn);c.append(span)}d.append(c);renderTree()}document.getElementById('search').oninput=renderTree;const rr=document.getElementById('rules');for(let r of DB.rules){let x=document.createElement('details');let s=document.createElement('summary');s.textContent=r.title;let p=document.createElement('p');p.textContent=r.expression+' — '+r.notes;x.append(s,p);rr.append(x)}const ss=document.getElementById('sources');for(let s of DB.sources){let p=document.createElement('p');p.className='notice';p.textContent=s[1]+' ['+s[2]+'] — '+s[3];ss.append(p)}select(selected);</script></body></html>
